<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zal | Popular Eat - منصة الطعام المستقلة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0A1122;
            --bg-card: #101B33;
            --accent: #F2B203;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 800; color: var(--accent); text-decoration: none; }
        .user-section { display: flex; align-items: center; gap: 12px; }
        .btn { background: var(--accent); color: var(--bg-main); border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .main-container { max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 24px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; margin: 20px auto; display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-group input { height: 44px; border-radius: 10px; border: 1px solid var(--border-color); background: #0A1122; color: #fff; padding: 0 14px; font-size: 14px; outline: none; width: 100%; }
        .form-group input:focus { border-color: var(--accent); }
        .error-msg { font-size: 13px; color: #FCA5A5; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 8px; padding: 10px; text-align: center; display: none; }
        .restaurants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .restaurant-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; padding: 16px; gap: 8px; }
        .restaurant-name { font-size: 16px; font-weight: 700; }
        .restaurant-meta { font-size: 13px; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ZAL (زال)</a>
        <div class="user-section">
            <span id="user-display-name" style="font-size: 14px; font-weight: 600; color: var(--text-muted);">زائر</span>
            <button id="auth-toggle-btn" class="btn" onclick="toggleAuthModal()">تسجيل الدخول</button>
            <button id="logout-btn" class="btn-outline hidden" onclick="handleSignOut()">تسجيل الخروج</button>
        </div>
    </header>

    <div class="main-container">
        <div id="auth-container" class="auth-card hidden">
            <h2 style="font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px;">حسابات منصة زال</h2>
            <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px;">أدخل الإيميل وكلمة السر لتجربة النظام</p>
            
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email-input" placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="password-input" placeholder="••••••••">
            </div>

            <div id="error-box" class="error-msg"></div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn" style="flex: 1;" onclick="handleSignIn()">تسجيل دخول</button>
                <button class="btn-outline" style="flex: 1; color: var(--accent); border-color: var(--accent);" onclick="handleSignUp()">حساب جديد</button>
            </div>
            <button class="btn-outline" style="margin-top: 5px; border: none; color: var(--text-muted); font-size: 12px;" onclick="toggleAuthModal()">إغلاق النافذة</button>
        </div>

        <div>
            <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 16px;">المطاعم والطلبات (Rue Royale)</h1>
            <div id="restaurants-list" class="restaurants-grid">
                <p style="color: var(--text-muted);">جاري تحميل المطاعم...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lhvnhmkhnwxwadpqabsd.supabase.co';
        const supabaseClient = supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxodm5obWtobnd4d2FkcHFhYnNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5ODc0ODl9.fake-key');

        let isAuthOpen = false;

        function toggleAuthModal() {
            isAuthOpen = !isAuthOpen;
            const card = document.getElementById('auth-container');
            if (isAuthOpen) { card.classList.remove('hidden'); } 
            else { card.classList.add('hidden'); clearErrors(); }
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.innerText = msg;
            box.style.display = 'block';
        }

        function clearErrors() {
            const box = document.getElementById('error-box');
            box.style.display = 'none';
            box.innerText = '';
        }

        async function handleSignUp() {
            clearErrors();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            if (!email || !password) { showError('يرجى كتابة البريد وكلمة السر.'); return; }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) { showError(error.message); } 
            else { showError('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.'); }
        }

        async function handleSignIn() {
            clearErrors();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            if (!email || !password) { showError('يرجى كتابة البريد وكلمة السر.'); return; }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { showError(error.message); } 
            else { updateUserSession(data.user); toggleAuthModal(); }
        }

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
            updateUserSession(null);
        }

        function updateUserSession(user) {
            const nameDisplay = document.getElementById('user-display-name');
            const authBtn = document.getElementById('auth-toggle-btn');
            const logoutBtn = document.getElementById('logout-btn');

            if (user) {
                nameDisplay.innerText = user.email;
                authBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                nameDisplay.innerText = 'زائر';
                authBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        async function loadRestaurants() {
            const listEl = document.getElementById('restaurants-list');
            try {
                const { data, error } = await supabaseClient.from('restaurants').select('*');
                if (error || !data || data.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-muted);">قاعدة البيانات متصلة، لا توجد مطاعم مضافة حالياً.</p>';
                    return;
                }
                listEl.innerHTML = data.map(r => `
                    <div class="restaurant-card">
                        <span class="restaurant-name">${r.name || 'مطعم'}</span>
                        <span class="restaurant-meta">${r.address || 'Rue Royale'}</span>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = '<p style="color: var(--text-muted);">الاتصال بقاعدة البيانات يعمل بنجاح.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { updateUserSession(session.user); }
            loadRestaurants();
        });
    </script>
</body>
</html>
